name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check 全部脚本与插件
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done < <(find deploy plugins \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*')
          exit $fail
      - name: shell 脚本语法
        run: |
          set -e
          for f in $(find deploy -name '*.sh'); do bash -n "$f" || { echo "语法错误: $f"; exit 1; }; done

  verify:
    name: 离线自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: make verify-all
        run: make verify-all

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Makefile 里的 chart 路径必须存在
        run: |
          set -e
          chart=$(sed -n 's/^HELM_CHART[[:space:]]*:=[[:space:]]*//p' Makefile)
          test -f "$chart/Chart.yaml" || { echo "HELM_CHART=$chart 下没有 Chart.yaml"; exit 1; }
          echo "HELM_CHART=$chart"
      - name: lint + template
        run: |
          set -e
          # 与 Makefile 用同一个镜像，避免 CI 与本地判据不一致
          docker run --rm -v "$PWD/deploy/helm/colony-agents:/apps" alpine/helm:3.16.3 lint /apps
          docker run --rm -v "$PWD/deploy/helm/colony-agents:/apps" alpine/helm:3.16.3 \
            template colony-agents /apps --namespace ai-tools > /dev/null
          echo "chart 能 lint 且能渲染"

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要扫历史：凭据删掉了也还在提交里
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 扫文件与历史（规则与白名单在仓库里）
        run: node deploy/orchestrator/scan-secrets.mjs --history
      - name: 运行时文件不能进版本库
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)(accounts\.json|nodes\.json|console-token|secret\.key|.*\.db|.*\.db-wal)$' | grep -v '\.example\.json' || true)
          if [ -n "$bad" ]; then
            echo "以下运行时/凭据文件不该被提交："
            echo "$bad"
            exit 1
          fi
          echo "没有运行时文件入库"
