# 抓控制面的平台指标。用法：
#   docker run -d --name prom -p 9090:9090 \
#     -v "$PWD/deploy/orchestrator/prometheus.yml:/etc/prometheus/prometheus.yml:ro" prom/prometheus
#
# 控制面在宿主机上，容器访问宿主要用 host.docker.internal（OrbStack / Docker Desktop 都支持）。
# Linux 上给容器加 --add-host=host.docker.internal:host-gateway。

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: dsh-platform
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9700']
    # 控制面接受 Authorization: Bearer <console-token>。
    # token 在 deploy/orchestrator/console-token，直接粘贴；别把这个文件提交进仓库。
    authorization:
      type: Bearer
      credentials: "替换成 deploy/orchestrator/console-token 的内容"

