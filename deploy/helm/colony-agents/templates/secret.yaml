{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "colony-agents.secretName" . }}
  labels:
    {{- include "colony-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | default "" | quote }}
{{- end }}
