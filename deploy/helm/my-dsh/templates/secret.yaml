{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "my-dsh.secretName" . }}
  labels:
    {{- include "my-dsh.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | default "" | quote }}
{{- end }}
