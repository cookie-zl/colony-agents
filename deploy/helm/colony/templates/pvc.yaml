{{- if and .Values.persistence.home.enabled (not .Values.persistence.home.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "colony.fullname" . }}-home
  labels:
    {{- include "colony.labels" . | nindent 4 }}
  {{- if .Values.persistence.home.keepOnUninstall }}
  annotations:
    # 卸载 release 时保留：这里有会话历史、凭据，以及运行时装过的插件
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.home.accessMode }}
  {{- if .Values.persistence.home.storageClass }}
  storageClassName: {{ .Values.persistence.home.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.home.size }}
{{- end }}
{{- if and .Values.persistence.workspace.enabled (not .Values.persistence.workspace.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "colony.fullname" . }}-workspace
  labels:
    {{- include "colony.labels" . | nindent 4 }}
  {{- if .Values.persistence.workspace.keepOnUninstall }}
  annotations:
    # agent 实际改的代码在这里，卸载别删
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.workspace.accessMode }}
  {{- if .Values.persistence.workspace.storageClass }}
  storageClassName: {{ .Values.persistence.workspace.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.workspace.size }}
{{- end }}
