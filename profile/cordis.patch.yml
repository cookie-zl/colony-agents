# 本 profile 的覆盖层：在每个 bundle 层之后应用。
# 顶层是一个 YAML 数组，元素是加载器 patch 条目。可用的操作：
#
#   - id: <已有行的 id>
#     <任意字段>: <新值>      # 覆盖该行字段；config 是「整块替换」，不是深合并
#   - id: <已有行的 id>
#     disabled: true          # 关掉这一行（插件仍在 node_modules 里，只是不加载）
#   - insert:                 # 追加新行
#       - id: <新 id>
#         name: <包名或绝对路径>
#
# 来源优先级（后者覆盖前者）：bundles 列表顺序 → 本文件 → $DSH_HOME/cordis.patch.yml → 命令行 --patch。
# 所以容器里的 DSH_MARKETPLACE=off 走的是最后那个 --patch 层，能压过本文件。
#
# 下面几条是常用写法的示例，去掉注释即可生效。

# 1) 改默认模型：行 id 是 agent-default-model，不是 llm
#    （config 是整块替换，写一半会把另一半冲掉，provider 与 model 必须一起给）
# - id: agent-default-model
#   config:
#     provider: deepseek-official
#     model: deepseek-flash

# 2) 关掉社区插件市场（等价于运行时 DSH_MARKETPLACE=off，但写死在这里）
# - id: dsh-plugin
#   disabled: true

# 3) 手工插入一个行，指向镜像里已安装的包
# - insert:
#     - id: hello-dsh
#       name: '@colony-agents/dsh-hello'
#       config:
#         greeting: '你好'

# ---------------------------------------------------------------------------
# 生效中的覆盖：默认模型指向 dsh-our-free-model（免费车道，不需要 API Key）
# ---------------------------------------------------------------------------
#
# 为什么必须在这里写、而不是在 UI 里选：
#   容器用 DSH_PROFILE_SEED=refresh，每次启动都会用镜像里的 profile 覆盖数据卷，
#   UI 里切模型写回的 cordis.patch.yml 会在下次重启时被冲掉。
#   想让选择稳定存活，就改这个文件，然后重新构建镜像。
#
# provider = 插件注册的路由 id：
#   our-free-model          免费车道主线（可用模型）
#   our-free-model-region   被地区策略挡住的那批，单独隔离
# model    = 上游模型 id，可用值见 Web 界面「设置 → Our Free Model → 模型清单」，
#            或 GET /api/our-free-model/summary 的 catalog[].id
- id: agent-default-model
  config:
    provider: our-free-model
    model: kilo-auto/free

# 示例：换成指定模型（把上面那行替换掉）
# - id: agent-default-model
#   config:
#     provider: our-free-model
#     model: nvidia/nemotron-3-ultra-550b-a55b:free

# ---------------------------------------------------------------------------
# 工作目录口径：没有历史目录的会话，一律从 /workspace 起
# ---------------------------------------------------------------------------
#
# dsh 默认拿启动进程的 cwd 当兜底目录。容器里那是 /workspace（Dockerfile 的 WORKDIR），
# 但「默认值恰好对」不算约定：换 WORKDIR、或者别的入口用别的 cwd 启动，兜底就飘了。
# 显式钉在 /workspace ——它是宿主目录的 bind mount，写进去的东西发版后还在。
#
# 用户手工建的工作区（会带具体的 <name>）由插件 workspace-guard 收敛到 /workspace/<name>，
# 这里只负责「连目录都没有」的那一档。
- id: working-directory
  config:
    defaultDirectory: /workspace
